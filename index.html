<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RLCC QR Camera Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    h1 { font-size: 22px; margin-top: 0; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #365233;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    video {
      width: 100%;
      margin-top: 16px;
      border-radius: 12px;
      background: #111;
      display: none;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #eee;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>RLCC QR Camera Test</h1>

    <p class="small">
      This is only a camera test. It does not connect to the attendance system
      and does not save attendance.
    </p>

    <button id="startBtn" onclick="startCamera()">Start Camera</button>
    <button id="stopBtn" onclick="stopCamera()" disabled>Stop Camera</button>

    <video id="video" autoplay playsinline muted></video>

    <div id="status" class="status">Ready. Tap “Start Camera”.</div>
  </div>

<script>
  let stream = null;

  function setStatus(message) {
    document.getElementById('status').textContent = message;
  }

  function explainError(error) {
    const name = error && error.name ? error.name : 'UnknownError';
    const message = error && error.message ? error.message : String(error);

    const explanations = {
      NotAllowedError:
        'Camera access was denied or blocked by the browser/site policy.',
      NotFoundError:
        'No camera was found on this device.',
      NotReadableError:
        'The camera exists, but another app or browser tab may already be using it.',
      SecurityError:
        'The browser blocked camera access for security reasons.',
      TypeError:
        'The camera API is unavailable. This can happen when the page is not in a secure context.'
    };

    return (
      'Camera could not start.\\n\\n' +
      'Error: ' + name + '\\n' +
      'Message: ' + message + '\\n\\n' +
      (explanations[name] || 'Please check the browser camera permission.')
    );
  }

  async function startCamera() {
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    setStatus(
      'Checking camera support...\\n' +
      'Secure context: ' + window.isSecureContext + '\\n' +
      'MediaDevices available: ' + !!navigator.mediaDevices
    );

    if (!window.isSecureContext) {
      setStatus(
        'This page is NOT being treated as a secure context.\\n\\n' +
        'Camera access normally requires HTTPS.'
      );
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus(
        'This browser does not provide the camera API (getUserMedia).'
      );
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' }
        },
        audio: false
      });

      video.srcObject = stream;
      video.style.display = 'block';
      startBtn.disabled = true;
      stopBtn.disabled = false;

      const track = stream.getVideoTracks()[0];
      const settings = track ? track.getSettings() : {};

      setStatus(
        'SUCCESS — the camera is working.\\n\\n' +
        'Camera: ' + (track ? track.label : 'Unknown') + '\\n' +
        'Width: ' + (settings.width || 'Unknown') + '\\n' +
        'Height: ' + (settings.height || 'Unknown')
      );
    } catch (error) {
      setStatus(explainError(error));
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    const video = document.getElementById('video');
    video.srcObject = null;
    video.style.display = 'none';

    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;

    setStatus('Camera stopped.');
  }

  window.addEventListener('pagehide', stopCamera);
</script>
</body>
</html>
