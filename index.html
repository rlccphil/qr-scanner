<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLCC QR Scanner Test</title>

  <!-- jsQR: QR decoder -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: Arial, sans-serif;
      background: #f5f6f4;
      color: #222;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #666;
      line-height: 1.5;
    }

    .upload {
      display: block;
      width: 100%;
      padding: 16px;
      border: 2px dashed #365233;
      border-radius: 12px;
      text-align: center;
      color: #365233;
      font-weight: 700;
      cursor: pointer;
      background: #fafcf9;
    }

    input[type="file"] {
      display: none;
    }

    .preview {
      margin-top: 20px;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 360px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #f0f2ef;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      background: #eaf5e7;
      color: #23451f;
    }

    .error {
      background: #fff0f0;
      color: #8b1e1e;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #777;
      margin-bottom: 5px;
    }

    .value {
      font-size: 18px;
      font-weight: 700;
    }

    .details {
      margin-top: 18px;
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>RLCC QR Scanner Test</h1>
    <p class="subtitle">
      Upload an RLCC member QR image. This test adds the required white
      quiet zone around the image before decoding.
    </p>

    <label class="upload" for="fileInput">
      📷 Scan QR from Photo
    </label>

    <input id="fileInput" type="file" accept="image/*">

    <div id="preview" class="preview"></div>

    <div id="status" class="status">
      Waiting for a QR image...
    </div>

    <canvas id="canvas"></canvas>

    <div class="details">
      <strong>Test target:</strong><br>
      Edgar Wong QR should decode as
      <code>RLCCATT:M-8A3F1BF91CDC4724</code>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const statusBox = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    fileInput.addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;

      preview.innerHTML = '';
      statusBox.className = 'status';
      statusBox.textContent = 'Reading image...';

      const reader = new FileReader();

      reader.onload = function (e) {
        const img = new Image();

        img.onload = function () {
          const previewImg = document.createElement('img');
          previewImg.src = e.target.result;
          preview.appendChild(previewImg);

          decodeWithMultiplePasses(img);
        };

        img.onerror = function () {
          showError('The selected image could not be opened.');
        };

        img.src = e.target.result;
      };

      reader.onerror = function () {
        showError('Could not read the selected file.');
      };

      reader.readAsDataURL(file);
    });

    function decodeWithMultiplePasses(img) {
      /*
       * The RLCC QR images currently touch the edges of the PNG.
       * A QR code requires a white "quiet zone" around it.
       *
       * We therefore try several versions:
       * 1. Original image with a 10% white border.
       * 2. Larger border.
       * 3. Grayscale.
       * 4. High-contrast black/white.
       */

      const attempts = [
        { border: 0.10, mode: 'original' },
        { border: 0.15, mode: 'original' },
        { border: 0.20, mode: 'original' },
        { border: 0.10, mode: 'gray' },
        { border: 0.15, mode: 'gray' },
        { border: 0.10, mode: 'threshold' },
        { border: 0.15, mode: 'threshold' }
      ];

      for (let i = 0; i < attempts.length; i++) {
        const result = tryDecode(img, attempts[i].border, attempts[i].mode);

        if (result) {
          showSuccess(result);
          return;
        }
      }

      showError(
        'No QR code was decoded from this image. ' +
        'The decoder tried multiple image-processing methods.'
      );
    }

    function tryDecode(img, borderRatio, mode) {
      const maxDimension = 1400;
      const scale = Math.min(1, maxDimension / Math.max(img.naturalWidth, img.naturalHeight));

      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));

      const border = Math.max(20, Math.round(Math.max(w, h) * borderRatio));

      canvas.width = w + border * 2;
      canvas.height = h + border * 2;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.drawImage(img, border, border, w, h);

      if (mode !== 'original') {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          let gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

          if (mode === 'threshold') {
            gray = gray < 128 ? 0 : 255;
          }

          data[i] = gray;
          data[i + 1] = gray;
          data[i + 2] = gray;
        }

        ctx.putImageData(imageData, 0, 0);
      }

      const imageData = ctx.getImageData(
        0, 0,
        canvas.width,
        canvas.height
      );

      try {
        const code = jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts: 'attemptBoth'
          }
        );

        return code ? code.data : null;
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    function showSuccess(value) {
      statusBox.className = 'status success';

      let qrId = value;

      if (value.indexOf('RLCCATT:') === 0) {
        qrId = value.substring(8).trim();
      }

      statusBox.innerHTML =
        '<div class="label">QR decoded successfully</div>' +
        '<div class="value">' + escapeHtml(value) + '</div>' +
        '<br>' +
        '<div class="label">QR ID</div>' +
        '<div class="value">' + escapeHtml(qrId) + '</div>';
    }

    function showError(message) {
      statusBox.className = 'status error';
      statusBox.textContent = message;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
