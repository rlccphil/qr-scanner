<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLCC QR Scanner</title>

  <!-- More robust QR decoder for this test -->
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    :root { --green:#365233; }
    * { box-sizing:border-box; }

    body {
      margin:0;
      background:#f5f6f4;
      color:#222;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    main {
      width:100%;
      max-width:520px;
      margin:auto;
      padding:24px 18px 40px;
    }

    .card {
      background:#fff;
      border-radius:20px;
      padding:22px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin:0;
      color:var(--green);
      font-size:27px;
    }

    .sub {
      margin:6px 0 20px;
      color:#666;
    }

    button, .fileButton {
      display:block;
      width:100%;
      border:0;
      border-radius:12px;
      padding:15px;
      margin-top:10px;
      font-size:16px;
      font-weight:700;
      background:var(--green);
      color:#fff;
      text-align:center;
      cursor:pointer;
    }

    button.secondary, .fileButton.secondary {
      background:#e7ece5;
      color:var(--green);
    }

    button:disabled {
      opacity:.45;
      cursor:default;
    }

    input[type=file] {
      display:none;
    }

    #video {
      width:100%;
      margin-top:18px;
      border-radius:14px;
      background:#111;
      display:none;
    }

    #photoPreview {
      width:100%;
      margin-top:18px;
      border-radius:14px;
      display:none;
    }

    #result {
      margin-top:18px;
      padding:16px;
      border-radius:14px;
      background:#eef2ed;
      white-space:pre-wrap;
      word-break:break-word;
      min-height:72px;
    }

    .ok {
      color:var(--green);
      font-weight:700;
    }

    .note {
      margin-top:16px;
      font-size:13px;
      line-height:1.5;
      color:#777;
    }
  </style>
</head>

<body>
<main>
  <div class="card">
    <h1>RLCC QR Scanner</h1>
    <p class="sub">Camera + photo QR scanning test</p>

    <button id="startBtn" onclick="startCamera()">📷 Start Camera</button>
    <button id="stopBtn" class="secondary" onclick="stopCamera()" disabled>Stop Camera</button>

    <label class="fileButton secondary" for="photoInput">
      🖼️ Scan QR from Photo
    </label>
    <input id="photoInput" type="file" accept="image/*" capture="environment" onchange="scanPhoto(event)">

    <video id="video" autoplay muted playsinline></video>
    <img id="photoPreview" alt="Selected image">

    <div id="result">
      <span class="ok">Ready.</span> Start the camera or choose a QR photo.
    </div>

    <p class="note">
      This version only reads the QR code. It does not record attendance
      and does not connect to the attendance system.
    </p>
  </div>
</main>

<script>
  let reader = null;
  let controls = null;
  let running = false;
  let lastText = "";

  function show(text) {
    document.getElementById("result").textContent = text;
  }

  function success(text) {
    lastText = text;

    show(
      "✓ QR CODE DETECTED\n\n" +
      "QR Value:\n" + text
    );

    if (navigator.vibrate) navigator.vibrate(120);
  }

  async function startCamera() {
    if (running) return;

    if (!window.isSecureContext) {
      show("Camera cannot start because this page is not HTTPS.");
      return;
    }

    if (!window.ZXingBrowser) {
      show("The QR decoder library did not load. Please refresh the page.");
      return;
    }

    document.getElementById("startBtn").disabled = true;
    show("Starting rear camera...");

    try {
      reader = new ZXingBrowser.BrowserQRCodeReader();

      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

      if (!devices || devices.length === 0) {
        throw new Error("No camera was found.");
      }

      // Prefer the rear/environment camera.
      let deviceId = devices[0].deviceId;
      const rear = devices.find(d =>
        /back|rear|environment|wide/i.test(d.label || "")
      );
      if (rear) deviceId = rear.deviceId;

      controls = await reader.decodeFromVideoDevice(
        deviceId,
        "video",
        (result, error) => {
          if (result) {
            const text = result.getText();

            if (text && text !== lastText) {
              success(text);
            }
          }
        }
      );

      running = true;
      document.getElementById("stopBtn").disabled = false;
      document.getElementById("video").style.display = "block";

      show("Camera is running.\n\nPoint the camera at an RLCC member QR code.");
    } catch (error) {
      document.getElementById("startBtn").disabled = false;

      show(
        "CAMERA / SCANNER ERROR\n\n" +
        (error && error.name ? error.name + "\n" : "") +
        (error && error.message ? error.message : String(error))
      );
    }
  }

  function stopCamera() {
    try {
      if (controls) controls.stop();
    } catch (_) {}

    try {
      if (reader) reader.reset();
    } catch (_) {}

    controls = null;
    reader = null;
    running = false;
    lastText = "";

    const video = document.getElementById("video");
    video.pause();
    video.srcObject = null;
    video.style.display = "none";

    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;

    show("Camera stopped.");
  }

  async function scanPhoto(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    show("Reading the selected photo...");

    const preview = document.getElementById("photoPreview");
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    try {
      if (!window.ZXingBrowser) {
        throw new Error("The QR decoder library did not load.");
      }

      const photoReader = new ZXingBrowser.BrowserQRCodeReader();

      const result = await photoReader.decodeFromImageUrl(
        URL.createObjectURL(file)
      );

      if (result) {
        success(result.getText());
      } else {
        show(
          "No QR code was detected in this photo.\n\n" +
          "Try a closer, sharper photo with the entire QR code visible."
        );
      }
    } catch (error) {
      show(
        "NO QR CODE DETECTED\n\n" +
        "The decoder could not read this photo.\n\n" +
        "Try taking a closer, sharper photo of the QR code."
      );
    }

    event.target.value = "";
  }

  window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
